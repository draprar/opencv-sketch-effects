name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint, Type Check, Security Scan & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 python3-tk

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install python-tk@${{ matrix.python-version }}

      - name: Run ruff linter
        run: |
          uv run ruff check src/ tests/

      - name: Run ruff formatter check
        run: |
          uv run ruff format --check src/ tests/

      - name: Run mypy type checker
        run: |
          uv run mypy src/

      - name: Run bandit security scanner
        run: |
          uv run bandit -r src/ -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: bandit-report.json

      - name: Run tests with coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run -a uv run pytest -m "not gui" --cov=src/tracify --cov-report=xml --cov-report=term

      - name: Run tests with coverage (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: |
          uv run pytest -m "not gui" --cov=src/tracify --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}  # Optional but recommended

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Run pip-audit
        run: |
          uv pip install pip-audit
          uv run pip-audit --desc
        continue-on-error: false
